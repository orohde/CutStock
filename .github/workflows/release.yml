name: Build & Release

on:
  push:
    tags:
      - '20*'  # Triggered by version tags like 2026.06.01

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS app
        run: pyinstaller desktop.spec --noconfirm

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../CutStock-macOS-${{ github.ref_name }}.zip CutStock.app

      - uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: CutStock-macOS-*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows exe
        run: pyinstaller desktop_win.spec --noconfirm

      - name: Create ZIP
        run: Compress-Archive -Path dist\CutStock -DestinationPath CutStock-Windows-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: CutStock-Windows-*.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CutStock ${{ github.ref_name }}
          body: |
            ## CutStock ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Note |
            |----------|------|------|
            | **macOS** | `CutStock-macOS-${{ github.ref_name }}.zip` | Unsigned — see below |
            | **Windows** | `CutStock-Windows-${{ github.ref_name }}.zip` | Unsigned — see below |

            ### Important: Unsigned builds

            These builds are **not code-signed**. Your operating system will show a security warning:

            - **macOS**: Right-click the app → "Open" → "Open" again to bypass Gatekeeper
            - **Windows**: Click "More info" → "Run anyway" to bypass SmartScreen

            This is normal for open-source software without a paid developer certificate.
          files: |
            artifacts/macos-build/*
            artifacts/windows-build/*
