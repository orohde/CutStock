name: Build & Release

on:
  push:
    tags:
      - '20*'  # Triggered by version tags like 2026.06.01

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # libusb für den Direktdruck auf Brother P-touch (desktop.spec / bruecke.spec)
          brew install libusb
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller certifi

      - name: Build macOS app
        run: pyinstaller desktop.spec --noconfirm

      - name: Build print bridge
        run: pyinstaller bruecke.spec --noconfirm

      - name: Check bundles
        run: |
          test -f "dist/CutStock.app/Contents/Frameworks/libusb-1.0.0.dylib"
          test -f "dist/CutStock Druckbrücke.app/Contents/Frameworks/libusb-1.0.0.dylib"

      - name: Create ZIPs
        run: |
          cd dist
          ditto -c -k --keepParent CutStock.app ../CutStock-macOS-${{ github.ref_name }}.zip
          ditto -c -k --keepParent "CutStock Druckbrücke.app" ../CutStock-Druckbruecke-macOS-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: CutStock-*macOS-*.zip

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows app
        run: pyinstaller desktop_win.spec --noconfirm

      - name: Create ZIP
        run: Compress-Archive -Path dist\CutStock -DestinationPath CutStock-Windows-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: CutStock-Windows-*.zip

  release:
    needs: [build-macos, build-windows]
    # Release auch dann erstellen, wenn nur der macOS-Build erfolgreich war
    if: always() && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CutStock ${{ github.ref_name }}
          body: |
            ## CutStock ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Note |
            |----------|------|------|
            | **macOS** | `CutStock-macOS-${{ github.ref_name }}.zip` | Unsigned — see below |
            | **Windows** | `CutStock-Windows-${{ github.ref_name }}.zip` | Unsigned — see below |
            | **macOS** | `CutStock-Druckbruecke-macOS-${{ github.ref_name }}.zip` | Print bridge (optional, **macOS only**) — see below |

            ### Print bridge (macOS only)

            The **CutStock print bridge** (Druckbrücke) is an optional, separate menu-bar app for the Mac a Brother P-touch label printer (PT-P710BT) is connected to via USB. It lets a CutStock Docker instance — and any browser or phone using it — print labels on that printer. Only needed if you print labels from the Docker instance. Setup: Settings → Labels & printer → Print bridge → Pair, then enter the address and pairing code in the bridge. Windows is not supported yet.

            ### Important: Unsigned builds

            These builds are **not code-signed**. Your operating system will show a security warning:

            - **macOS**: Right-click the app → "Open" → "Open" again to bypass Gatekeeper
            - **Windows**: Click "More info" → "Run anyway" to bypass SmartScreen

            This is normal for small independent software without a paid developer certificate.

            The app opens your default browser — no additional runtimes needed.
          files: |
            artifacts/macos-build/*
            artifacts/windows-build/*
