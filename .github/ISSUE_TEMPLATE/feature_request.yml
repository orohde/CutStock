name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! English or German is fine.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation in your workshop or the problem you run into.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How could CutStock help?
      description: Your idea for a solution -- a rough sketch is enough.

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: How do you handle this today?
